<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AI</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #101f35;
      border-bottom: 1px solid #24466b;
    }

    header h1 {
      margin: 0;
      color: #55d9ff;
    }

    header p {
      color: #a9c7df;
      margin-bottom: 0;
    }

    #chat {
      height: calc(100dvh - 165px);
      overflow-y: auto;
      padding: 16px;
    }

    .message {
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 14px;
      max-width: 90%;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .bot {
      background: #142b45;
      border: 1px solid #24466b;
    }

    .user {
      background: #075985;
      margin-left: auto;
    }

    form {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #101f35;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #34516f;
      background: #07111f;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 12px 15px;
      border: 0;
      border-radius: 10px;
      background: #06b6d4;
      color: #04111d;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>🤖 JARVIS AI</h1>
    <p>Your personal AI assistant</p>
  </header>

  <main id="chat" aria-live="polite">
    <div class="message bot">
      Hello! Main JARVIS hoon. 👋
      Abhi mera AI connection setup nahi hua hai.
      Agle step mein hum AI connect karenge!
    </div>
  </main>

  <form id="form">
    <input id="input" placeholder="Ask me anything..."
           autocomplete="off" required>
    <button type="submit">Send</button>
  </form>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = "message " + type;
      message.textContent = text;
      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const question = input.value.trim();
      if (!question) return;

      addMessage(question, "user");
      addMessage(
        "Abhi AI connect nahi hai. Hum agle step mein ise connect karenge!",
        "bot"
      );

      input.value = "";
    });
  </script>
</body>
</html>
