<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#07111f;color:#eaf6ff;
font-family:Arial,sans-serif;padding:20px
}
.app{max-width:600px;margin:auto}
h1{text-align:center;color:#48d9ff;letter-spacing:4px}
.sub{text-align:center;color:#9bb5c9}
#chat{
height:55vh;min-height:300px;overflow-y:auto;
border:1px solid #24506b;border-radius:16px;
padding:14px;background:#0b1b2b
}
.msg{padding:12px;margin:10px 0;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{background:#14334a}
.user{background:#164b51;text-align:right}
.controls{display:flex;gap:8px;margin-top:12px}
input{
min-width:0;flex:1;padding:14px;border-radius:12px;
border:1px solid #39718b;background:#102438;color:white
}
button{
padding:12px;border:0;border-radius:12px;
background:#26bce5;color:#04121c;font-weight:bold
}
.buttons{display:flex;gap:10px;margin-top:10px}
.buttons button{flex:1}
#status{text-align:center;color:#9bb5c9;margin-top:12px}
</style>
</head>
<body>
<div class="app">
<h1>J.A.R.V.I.S</h1>
<p class="sub">YOUR PERSONAL AI ASSISTANT</p>

<div id="chat">
<div class="msg bot">Hello! Main JARVIS hoon. 👋
Abhi mera demo mode chalu hai. Asli AI connection agle step mein jodenge.</div>
</div>

<div class="controls">
<input id="prompt" placeholder="Message JARVIS...">
<button id="send">Send</button>
</div>

<div class="buttons">
<button id="mic">🎙️ Speak</button>
<button id="voice">🔊 Voice ON</button>
</div>
<p id="status">JARVIS ready • Demo mode</p>
</div>

<script>
const chat=document.getElementById('chat');
const input=document.getElementById('prompt');
const status=document.getElementById('status');
let voiceOn=true;

function addMessage(text,who){
const div=document.createElement('div');
div.className='msg '+who;
div.textContent=text;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
}

function speak(text){
if(!voiceOn||!('speechSynthesis'in window))return;
speechSynthesis.cancel();
const msg=new SpeechSynthesisUtterance(text);
msg.lang='hi-IN';
speechSynthesis.speak(msg);
}

function reply(){
const text=input.value.trim();
if(!text)return;
addMessage(text,'user');
input.value='';
const answer='Tumne kaha: "'+text+'". Main abhi demo mode mein hoon. Asli AI connection jodna baaki hai.';
addMessage(answer,'bot');
speak(answer);
}

document.getElementById('send').onclick=reply;
input.addEventListener('keydown',e=>{if(e.key==='Enter')reply()});

document.getElementById('voice').onclick=()=>{
voiceOn=!voiceOn;
document.getElementById('voice').textContent=voiceOn?'🔊 Voice ON':'🔇 Voice OFF';
if(!voiceOn&&'speechSynthesis'in window)speechSynthesis.cancel();
};

document.getElementById('mic').onclick=()=>{
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){status.textContent='Voice input supported nahi hai';return;}
const recognition=new SR();
recognition.lang='hi-IN';
recognition.onstart=()=>status.textContent='Listening...';
recognition.onresult=e=>{
input.value=e.results[0][0].transcript;
status.textContent='Voice captured. Send dabao.';
};
recognition.onerror=()=>status.textContent='Mic error. Permission check karo.';
recognition.start();
};
</script>
</body>
</html>
